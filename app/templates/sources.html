<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Agregar Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- <link href="{{ url_for('static', filename='css/sources.css') }}" rel="stylesheet"> -->
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>List of event types </h1>
            <a href="/" class="btn btn-outline-secondary">
                ← Volver al menu principal
            </a>
        </div>

        <button type="button" class="btn btn-primary create-btn mb-3" id="create-source-btn">
            <i class="bi bi-plus-circle me-2"></i>Create Event Type
        </button>

        {% if sources %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Source name</th>
                    <th>Source description</th>
                    <th class="actions-column">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for source in sources %}
                <tr data-source-id="{{ source.source_id }}">
                    <td>{{ source.source_id }}</td>
                    <td>{{ source.source_name }}</td>
                    <td>{{ source.source_description }}</td>
                    <td>
                        <a href="/sources/{{ source.source_id }}" class="btn btn-sm btn-primary me-1">
                            <i class="bi bi-eye"></i> View
                        </a>
                        <button class="btn btn-sm btn-danger delete-source" data-source-id="{{ source.source_id }}">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>        
        {% else %}
        <div class="alert alert-warning">No event types found</div>
        {% endif %}
    </div>

    <!-- <script type="module" src="{{ url_for('static', filename='js/sources.js') }}"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
