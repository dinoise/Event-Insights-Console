<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeos de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Agregar Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- <link href="{{ url_for('static', filename='css/event_types.css') }}" rel="stylesheet"> -->
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>List of event types </h1>
            <a href="/" class="btn btn-outline-secondary">
                ← Volver al menu principal
            </a>
        </div>

        <button type="button" class="btn btn-primary create-btn mb-3" id="create-type-btn">
            <i class="bi bi-plus-circle me-2"></i>Create Event Type
        </button>

        {% if event_types %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type name</th>
                    <th>Type action</th>
                    <th class="actions-column">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for type in event_types %}
                <tr data-type-id="{{ type.event_type_id }}">
                    <td>{{ type.event_type_id }}</td>
                    <td>{{ type.event_type_name }}</td>
                    <td>{{ type.event_type_action }}</td>
                    <td>
                        <a href="/event-types/{{ type.event_type_id }}" class="btn btn-sm btn-primary me-1">
                            <i class="bi bi-eye"></i> View
                        </a>
                        <button class="btn btn-sm btn-danger delete-type" data-type-id="{{ type.event_type_id }}">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>        
        {% else %}
        <div class="alert alert-warning">No event types found</div>
        {% endif %}
    </div>

    <!-- <script type="module" src="{{ url_for('static', filename='js/event_types.js') }}"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
